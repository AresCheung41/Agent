<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent 代码与运行过程交互式图解 — agent.py & tools.py</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-app: #0b1120;
      --bg-panel: #0f172a;
      --bg-card: #1e293b;
      --border-subtle: #1e293b;
      --border-strong: #334155;
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background-color: var(--bg-app);
      color: #e2e8f0;
    }
    .app-shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      width: 100%;
      overflow: hidden;
    }
    .workspace-grid {
      flex: 1 1 0%;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(300px, 40%) minmax(0, 1fr);
      width: 100%;
      overflow: hidden;
    }
    .left-pane, .right-pane {
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .diagram-section {
      flex: 1 1 74%;
      min-height: 280px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: flex-basis 0.18s ease;
    }
    .inspector-section {
      flex: 0 0 26%;
      min-height: 150px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .right-pane.diagram-expanded .diagram-section {
      flex: 1 1 100%;
    }
    .right-pane.diagram-expanded .inspector-section {
      flex: 0 0 34px;
      min-height: 34px;
    }
    .right-pane.diagram-expanded #inspector-scroll-area {
      display: none;
    }
    .diagram-canvas-wrap {
      flex: 1 1 0%;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      position: relative;
    }
    .diagram-canvas-wrap svg {
      width: 100%;
      height: 100%;
      display: block;
      transition: width 0.15s ease, height 0.15s ease;
    }

    /* On very narrow mobile screens (<720px), keep diagram pinned in top half and code scrollable in bottom half */
    @media (max-width: 719px) {
      .workspace-grid {
        grid-template-columns: 1fr;
        grid-template-rows: 46% 54%;
      }
      .right-pane {
        order: -1;
        border-bottom: 1px solid #1e293b;
      }
      .diagram-section {
        flex: 1 1 0%;
        min-height: 0;
      }
      .inspector-section {
        flex: 0 0 38%;
      }
    }
    .font-mono-code {
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }

    /* Code line styling */
    .code-line {
      display: flex;
      align-items: flex-start;
      padding: 2px 12px 2px 0;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: background-color 0.15s ease, border-color 0.15s ease;
      line-height: 1.55;
      font-size: 12.5px;
    }
    .code-line:hover {
      background-color: rgba(56, 189, 248, 0.08);
    }
    .code-line.active-line {
      background-color: rgba(56, 189, 248, 0.16);
      border-left-color: var(--active-accent, #38bdf8);
    }
    .code-line.active-line .line-num {
      color: #f8fafc;
      font-weight: 600;
    }
    .line-num {
      width: 38px;
      min-width: 38px;
      text-align: right;
      padding-right: 12px;
      color: #475569;
      user-select: none;
      font-size: 11.5px;
    }
    .line-code {
      white-space: pre;
      flex: 1;
    }

    /* Syntax tokens */
    .tok-kw { color: #c084fc; font-weight: 500; }
    .tok-fn { color: #38bdf8; }
    .tok-str { color: #86efac; }
    .tok-num { color: #fbbf24; }
    .tok-com { color: #64748b; font-style: italic; }
    .tok-dec { color: #f472b6; font-weight: 500; }
    .tok-cls { color: #fcd34d; }
    .tok-op { color: #94a3b8; }

    /* SVG Diagram animations */
    .flow-node {
      cursor: pointer;
      transition: filter 0.2s ease, opacity 0.2s ease;
    }
    .flow-node rect.node-box,
    .flow-node polygon.node-box {
      transition: stroke 0.2s ease, stroke-width 0.2s ease, fill 0.2s ease;
    }
    .flow-node:hover rect.node-box,
    .flow-node:hover polygon.node-box {
      filter: brightness(1.18);
    }
    .flow-node.dimmed {
      opacity: 0.42;
    }
    .flow-node.active-node {
      opacity: 1;
      filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.55));
    }
    .flow-edge {
      transition: stroke 0.25s ease, stroke-width 0.25s ease, opacity 0.25s ease;
    }
    .flow-edge.active-edge {
      stroke-dasharray: 8 4;
      animation: dashFlow 0.85s linear infinite;
      opacity: 1 !important;
    }
    @keyframes dashFlow {
      to { stroke-dashoffset: -24; }
    }
    @keyframes pulseRing {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.35; }
    }
    .active-pulse {
      animation: pulseRing 1.6s ease-in-out infinite;
    }

    /* Stage pill dot */
    .stage-dot {
      width: 8px;
      height: 8px;
      border-radius: 9999px;
      display: inline-block;
      flex-shrink: 0;
    }
  </style>
</head>
<body class="app-shell bg-[#0b1120] text-slate-200">

  <!-- SINGLE ULTRA-SLIM TOP TOOLBAR (40px) -->
  <header class="shrink-0 h-10 border-b border-slate-800 bg-[#0f172a] px-2.5 flex items-center justify-between gap-2">
    <!-- Left: File Switcher Tabs -->
    <div class="flex items-center gap-1 shrink-0">
      <button id="tab-agent" type="button"
        class="file-tab flex items-center gap-1.5 px-2.5 py-1 text-xs font-semibold rounded-md bg-sky-500/20 text-sky-300 border border-sky-500/35">
        <i data-lucide="file-code-2" class="w-3.5 h-3.5 text-sky-400"></i>
        agent.py
      </button>
      <button id="tab-tools" type="button"
        class="file-tab flex items-center gap-1.5 px-2.5 py-1 text-xs font-medium rounded-md text-slate-400 hover:text-slate-200 border border-transparent">
        <i data-lucide="wrench" class="w-3.5 h-3.5 text-amber-400"></i>
        tools.py
      </button>
      <span id="active-line-range" class="hidden md:inline-block ml-1.5 text-[11px] font-mono-code text-slate-400"></span>
    </div>

    <!-- Center: Compact Simulation Controls -->
    <div class="flex items-center gap-1.5 shrink-0">
      <div class="hidden sm:flex items-center bg-slate-950/70 border border-slate-800 rounded-md p-0.5 text-[11px]">
        <button id="btn-scenario-normal" type="button"
          class="px-2 py-0.5 rounded font-medium bg-sky-500/20 text-sky-300">多轮调用</button>
        <button id="btn-scenario-error" type="button"
          class="px-2 py-0.5 rounded font-medium text-slate-400 hover:text-slate-200">异常自愈</button>
      </div>
      <div class="flex items-center gap-0.5 bg-slate-950/70 border border-slate-800 rounded-md px-1 py-0.5">
        <button id="btn-prev" type="button" title="上一步"
          class="p-1 rounded hover:bg-slate-800 text-slate-300 hover:text-white disabled:opacity-35">
          <i data-lucide="skip-back" class="w-3.5 h-3.5"></i>
        </button>
        <button id="btn-play" type="button"
          class="flex items-center gap-1 px-2 py-0.5 rounded bg-sky-600 hover:bg-sky-500 text-white text-[11px] font-medium">
          <i data-lucide="play" class="w-3 h-3" id="icon-play"></i>
          <span id="label-play">演示</span>
        </button>
        <button id="btn-next" type="button" title="下一步"
          class="p-1 rounded hover:bg-slate-800 text-slate-300 hover:text-white disabled:opacity-35">
          <i data-lucide="skip-forward" class="w-3.5 h-3.5"></i>
        </button>
        <button id="btn-reset" type="button" title="重置"
          class="p-1 rounded hover:bg-slate-800 text-slate-400 hover:text-white">
          <i data-lucide="rotate-ccw" class="w-3 h-3"></i>
        </button>
      </div>
      <span id="step-summary" class="hidden xl:inline-block max-w-[240px] truncate text-[11px] text-sky-300 font-medium"></span>
    </div>

    <!-- Right: Diagram Zoom & View Controls -->
    <div class="flex items-center gap-1.5 shrink-0">
      <div class="flex items-center bg-slate-950/70 border border-slate-800 rounded-md px-0.5 py-0.5">
        <button id="btn-zoom-out" type="button" title="缩小"
          class="px-1.5 text-xs text-slate-300 hover:text-white hover:bg-slate-800 rounded">−</button>
        <span id="zoom-label" class="px-1 text-[11px] font-mono-code text-slate-300 select-none">100%</span>
        <button id="btn-zoom-in" type="button" title="放大"
          class="px-1.5 text-xs text-slate-300 hover:text-white hover:bg-slate-800 rounded">+</button>
      </div>
      <button id="btn-expand-diagram" type="button"
        class="flex items-center gap-1 text-[11px] px-2 py-1 rounded-md bg-sky-500/15 hover:bg-sky-500/25 text-sky-300 border border-sky-500/30">
        <i data-lucide="maximize-2" class="w-3 h-3"></i>
        <span id="label-expand-diagram">收起解析</span>
      </button>
      <button id="btn-show-all" type="button" title="取消高亮聚焦"
        class="text-[11px] px-2 py-1 rounded-md bg-slate-800 hover:bg-slate-700 text-slate-300">
        全景
      </button>
    </div>
  </header>

  <!-- MAIN WORKSPACE: Pure Edge-to-Edge Code (Left) + Flowchart & Compact Inspector (Right) -->
  <main class="workspace-grid">

    <!-- LEFT PANE: Full-Height Code Only -->
    <section class="left-pane border-r border-slate-800 bg-[#0d1424]">
      <div id="code-scroll-area" class="flex-1 min-h-0 overflow-y-auto overflow-x-auto py-1.5 font-mono-code select-text">
        <div id="code-lines-container"></div>
      </div>
    </section>

    <!-- RIGHT PANE: Full-Area Flowchart + Compact Collapsible Inspector -->
    <section class="right-pane bg-[#080d1a]">
      <div class="diagram-section relative border-b border-slate-800 bg-[#080d1a] p-1.5">
        <div class="diagram-canvas-wrap">
          <svg id="agent-flow-svg" viewBox="0 0 900 500" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
              </marker>
              <marker id="arrow-sky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
              </marker>
            </defs>

            <!-- Background Swimlane Containers -->
            <rect x="8" y="8" width="218" height="484" rx="14" fill="#111827" fill-opacity="0.78" stroke="#581c87" stroke-width="1.4" stroke-dasharray="5 4" />
            <text x="20" y="31" fill="#d8b4fe" font-size="13.5" font-weight="700">阶段 0 · 启动与注册</text>

            <rect x="238" y="8" width="424" height="484" rx="14" fill="#0f172a" fill-opacity="0.86" stroke="#1d4ed8" stroke-width="1.4" stroke-dasharray="5 4" />
            <text x="250" y="31" fill="#60a5fa" font-size="13.5" font-weight="700">阶段 1~3 · ReAct 核心循环 (最多 20 圈)</text>

            <rect x="674" y="8" width="218" height="484" rx="14" fill="#1c1917" fill-opacity="0.72" stroke="#92400e" stroke-width="1.4" stroke-dasharray="5 4" />
            <text x="686" y="31" fill="#fbbf24" font-size="13.5" font-weight="700">阶段 4 · 工具执行层</text>

            <!-- ================= EDGES (DATA FLOW) ================= -->
            <path id="edge-reg-init" class="flow-edge" d="M 117 158 L 117 190" stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#arrow-slate)" />
            <path id="edge-init-repl" class="flow-edge" d="M 117 302 L 117 336" stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#arrow-slate)" />
            <path id="edge-repl-user" class="flow-edge" d="M 214 394 L 230 394 L 230 112 L 250 112" stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#arrow-slate)" />
            <path id="edge-user-llm" class="flow-edge" d="M 430 112 L 456 112" stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#arrow-slate)" />

            <!-- get_schemas -> llm_call -->
            <path id="edge-schema-llm" class="flow-edge" d="M 214 92 L 230 92 L 230 50 L 554 50 L 554 64" stroke="#64748b" stroke-width="1.8" stroke-dasharray="4 3" fill="none" marker-end="url(#arrow-slate)" />
            <rect x="330" y="39" width="152" height="20" rx="5" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
            <text x="406" y="53" text-anchor="middle" fill="#e2e8f0" font-size="11.5" font-weight="600" font-family="JetBrains Mono, monospace">tools=get_schemas()</text>

            <!-- llm_call -> check_tools -->
            <path id="edge-llm-check" class="flow-edge" d="M 554 158 L 554 184" stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#arrow-slate)" />

            <!-- check_tools -> final_answer -->
            <path id="edge-check-final" class="flow-edge" d="M 468 228 L 342 228 L 342 272" stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#arrow-slate)" />
            <rect x="348" y="206" width="112" height="20" rx="5" fill="#064e3b" fill-opacity="0.9" />
            <text x="404" y="220" text-anchor="middle" fill="#6ee7b7" font-size="11.5" font-weight="700">无 tool_calls</text>

            <!-- check_tools -> tool_loop -->
            <path id="edge-check-loop" class="flow-edge" d="M 554 270 L 554 306" stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#arrow-slate)" />
            <rect x="562" y="276" width="90" height="20" rx="5" fill="#451a03" fill-opacity="0.95" />
            <text x="607" y="290" text-anchor="middle" fill="#fcd34d" font-size="11.5" font-weight="700">有 tool_calls</text>

            <!-- tool_loop -> execute_tool -->
            <path id="edge-loop-exec" class="flow-edge" d="M 648 354 L 666 354 L 666 126 L 684 126" stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#arrow-slate)" />

            <!-- execute_tool -> concrete_tools -->
            <path id="edge-exec-concrete" class="flow-edge" d="M 783 188 L 783 216" stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#arrow-slate)" />

            <!-- concrete_tools -> tool_loop return -->
            <path id="edge-concrete-back" class="flow-edge" d="M 783 418 L 783 462 L 554 462 L 554 412" stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#arrow-slate)" />
            <rect x="566" y="450" width="210" height="22" rx="6" fill="#080d1a" stroke="#92400e" stroke-width="0.9" />
            <text x="671" y="465" text-anchor="middle" fill="#fbbf24" font-size="11.5" font-weight="600">返回字符串 (≤8000字 / 捕获异常)</text>

            <!-- tool_loop -> llm_call (ReAct Feedback Loop) -->
            <path id="edge-loop-llm" class="flow-edge" d="M 460 354 L 444 354 L 444 172 L 496 172 L 496 160" stroke="#64748b" stroke-width="2.4" fill="none" marker-end="url(#arrow-slate)" />
            <rect x="330" y="366" width="122" height="22" rx="5" fill="#1e1b4b" stroke="#4f46e5" stroke-width="0.8" />
            <text x="391" y="381" text-anchor="middle" fill="#c7d2fe" font-size="11" font-weight="700">追加 tool · 下一轮 ↻</text>

            <!-- max_steps fallback -->
            <path id="edge-max-steps" class="flow-edge" d="M 342 362 L 342 400" stroke="#64748b" stroke-width="1.8" stroke-dasharray="4 3" fill="none" marker-end="url(#arrow-slate)" />

            <!-- ================= NODES ================= -->

            <!-- Node 1: tool_registry -->
            <g class="flow-node" data-node="tool_registry" transform="translate(20, 48)">
              <rect class="node-box" width="194" height="110" rx="11" fill="#1e1b4b" stroke="#a855f7" stroke-width="2" />
              <text x="14" y="26" fill="#d8b4fe" font-size="12" font-weight="600">tools.py · import</text>

              <text x="14" y="97" fill="#c4b5fd" font-size="12">生成 JSON Schema</text>

            <!-- Node 2: client_init -->
            <g class="flow-node" data-node="client_init" transform="translate(20, 192)">
              <rect class="node-box" width="194" height="110" rx="11" fill="#172554" stroke="#818cf8" stroke-width="2" />
              <text x="14" y="26" fill="#a5b4fc" font-size="12" font-weight="600">agent.py · 全局配置</text>
              <text x="14" y="54" fill="#ffffff" font-size="16" font-weight="700">客户端与系统设定</text>
              <text x="14" y="78" fill="#e2e8f0" font-size="12.5">OpenAI (DeepSeek)</text>
              <text x="14" y="97" fill="#93c5fd" font-size="12">MAX_STEPS=20 · SYSTEM</text>
            </g>

            <!-- Node 3: repl_entry -->
            <g class="flow-node" data-node="repl_entry" transform="translate(20, 338)">
              <rect class="node-box" width="194" height="114" rx="11" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2" />
              <text x="14" y="26" fill="#7dd3fc" font-size="12" font-weight="600">agent.py · __main__</text>
              <text x="14" y="54" fill="#ffffff" font-size="16" font-weight="700">REPL 交互主循环</text>
              <text x="14" y="78" fill="#e2e8f0" font-size="12.5">初始化 messages=[sys]</text>
              <text x="14" y="99" fill="#bae6fd" font-size="12">保持多轮对话记忆</text>
            </g>

            <!-- Node 4: append_user -->
            <g class="flow-node" data-node="append_user" transform="translate(252, 68)">
              <rect class="node-box" width="178" height="88" rx="11" fill="#0f2942" stroke="#38bdf8" stroke-width="2" />
              <text x="14" y="25" fill="#7dd3fc" font-size="12" font-weight="600">agent.py · run()</text>
              <text x="14" y="52" fill="#ffffff" font-size="16" font-weight="700">写入用户问题</text>
              <text x="14" y="74" fill="#cbd5e1" font-size="12">messages.append(user)</text>
            </g>

            <!-- Node 5: llm_call -->
            <g class="flow-node" data-node="llm_call" transform="translate(458, 66)">
              <rect class="node-box" width="192" height="92" rx="11" fill="#1e1b4b" stroke="#6366f1" stroke-width="2.2" />
              <text x="14" y="25" fill="#a5b4fc" font-size="12" font-weight="600">核心大脑 · API 请求</text>
              <text x="14" y="53" fill="#ffffff" font-size="16.5" font-weight="700">LLM 推理决策</text>
              <text x="14" y="76" fill="#e2e8f0" font-size="12">发 messages+tools · 存回复</text>
            </g>

            <!-- Node 6: check_tools (Decision Diamond) -->
            <g class="flow-node" data-node="check_tools" transform="translate(468, 186)">
              <polygon class="node-box" points="86,0 172,42 86,84 0,42" fill="#1e293b" stroke="#38bdf8" stroke-width="2.2" />
              <text x="86" y="38" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">需要调工具?</text>
              <text x="86" y="57" text-anchor="middle" fill="#cbd5e1" font-size="12">msg.tool_calls</text>
            </g>

            <!-- Node 7: final_answer -->
            <g class="flow-node" data-node="final_answer" transform="translate(252, 274)">
              <rect class="node-box" width="178" height="88" rx="11" fill="#064e3b" stroke="#10b981" stroke-width="2.2" />
              <text x="14" y="25" fill="#6ee7b7" font-size="12" font-weight="600">循环出口 · 完成</text>
              <text x="14" y="52" fill="#ffffff" font-size="16" font-weight="700">返回最终答案</text>
              <text x="14" y="74" fill="#d1fae5" font-size="12">return msg.content</text>
            </g>

            <!-- Node 8: max_steps -->
            <g class="flow-node" data-node="max_steps" transform="translate(252, 402)">
              <rect class="node-box" width="178" height="68" rx="10" fill="#4c0519" stroke="#f43f5e" stroke-width="1.8" />
              <text x="14" y="25" fill="#fda4af" font-size="12" font-weight="600">熔断兜底机制</text>
              <text x="14" y="51" fill="#ffffff" font-size="15" font-weight="700">达 20 步强制停止</text>
            </g>

            <!-- Node 9: tool_loop -->
            <g class="flow-node" data-node="tool_loop" transform="translate(460, 308)">
              <rect class="node-box" width="188" height="102" rx="11" fill="#451a03" stroke="#f59e0b" stroke-width="2.2" />

      },
      {
        name: 'fetch_url',
        lines: '70-75',

        params: { url: '网页或接口的url' },
        safety: '网络只读，已设 timeout=15 与自定义 User-Agent: Makima-agent'

    // =========================================================================
    // 4. APPLICATION STATE
    // =========================================================================
    const state = {
      activeFile: 'agent',        // 'agent' | 'tools'
      activeNodeId: 'llm_call',   // Currently highlighted node (null = overview)
      activeInspTab: 'explain',   // 'explain' | 'messages' | 'registry'
      scenarioKey: 'normal',      // 'normal' | 'error'

      diagramZoom: 100,
      diagramExpanded: false

    // =========================================================================
    // 5. SYNTAX HIGHLIGHTER (Lightweight, Safe, Exact)
    // =========================================================================
    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function highlightPythonLine(rawLine) {
      if (!rawLine) return '&nbsp;';
      // Separate trailing comment (outside quotes)
      let codePart = rawLine;
      let commentPart = '';
      let inSingle = false, inDouble = false;
      for (let i = 0; i < rawLine.length; i++) {
        const ch = rawLine[i];
        const prev = i > 0 ? rawLine[i - 1] : '';
        if (ch === "'" && !inDouble && prev !== '\\') inSingle = !inSingle;
        else if (ch === '"' && !inSingle && prev !== '\\') inDouble = !inDouble;
        else if (ch === '#' && !inSingle && !inDouble) {
          codePart = rawLine.slice(0, i);
          commentPart = rawLine.slice(i);
          break;
        }
      }

      // Tokenize strings first so keywords inside strings are untouched
      const placeholders = [];
      let safe = escapeHtml(codePart).replace(/(f?&quot;.*?&quot;|f?&#39;.*?&#39;|f?"[^"]*"|f?'[^']*')/g, (m) => {
        const idx = placeholders.length;
        placeholders.push(`<span class="tok-str">${m}</span>`);
        return `__STR_${idx}__`;
      });

      // Decorators
      safe = safe.replace(/^(\s*)(@\w+)/, '$1<span class="tok-dec">$2</span>');
      // Keywords
      const kwRegex = /\b(import|from|def|return|for|in|if|not|try|except|else|while|break|with|as|or|and|True|False|None)\b/g;
      safe = safe.replace(kwRegex, '<span class="tok-kw">$1</span>');
      // Function definitions
      safe = safe.replace(/(<span class="tok-kw">def<\/span>\s+)(\w+)/g, '$1<span class="tok-fn">$2</span>');
      // Classes / Constants
      safe = safe.replace(/\b(OpenAI|Path|Exception|MAX_STEPS|MAX_OUTPUT|TOOLS|MODEL|SYSTEM)\b/g, '<span class="tok-cls">$1</span>');
      // Numbers
      safe = safe.replace(/\b(\d+)\b/g, '<span class="tok-num">$1</span>');

      // Restore strings
      safe = safe.replace(/__STR_(\d+)__/g, (_, i) => placeholders[Number(i)]);

      if (commentPart) {
        safe += `<span class="tok-com">${escapeHtml(commentPart)}</span>`;
      }
      return safe;
    }

    // Map any (file, 1-based lineNumber) -> best matching nodeId
    function getNodeForLine(fileKey, lineNum) {
      // Exact priority order so overlapping lines pick the most specific node
      const priority = fileKey === 'agent'
        ? ['max_steps', 'final_answer', 'check_tools', 'tool_loop', 'llm_call', 'append_user', 'repl_entry', 'tool_registry', 'client_init']
        : ['execute_tool', 'concrete_tools', 'tool_registry'];

      for (const nid of priority) {
        const ranges = NODES[nid].codeRanges[fileKey] || [];
        for (const [start, end] of ranges) {
          if (lineNum >= start && lineNum <= end) {
            // Special precision: line 46 is max_steps, line 15/26 belong to client_init / llm_call on direct click
            if (nid === 'max_steps' && lineNum !== 46) continue;
            if (nid === 'final_answer' && lineNum === 54) continue;
            if (nid === 'execute_tool' && fileKey === 'agent') continue;
            return nid;
          }
        }
      }
      return fileKey === 'agent' ? 'client_init' : 'tool_registry';
    }

    // =========================================================================
    // 6. RENDERING FUNCTIONS
    // =========================================================================
    function renderCodePanel(scrollToActive = false) {
      const fileObj = FILES[state.activeFile];
      const container = document.getElementById('code-lines-container');
      const activeNode = state.activeNodeId ? NODES[state.activeNodeId] : null;

      // Determine highlighted line ranges
      let activeRanges = [];
      if (state.simMode) {
        const step = SCENARIOS[state.scenarioKey].steps[state.simStepIndex];
        if (step.file === state.activeFile) {
          activeRanges = [step.highlightLines];
        }
      } else if (activeNode) {
        activeRanges = activeNode.codeRanges[state.activeFile] || [];
      }

      const accent = activeNode ? activeNode.accent : '#38bdf8';

      let html = '';
      let firstActiveLineElId = null;

      fileObj.lines.forEach((raw, idx) => {
        const lineNum = idx + 1;
        const isActive = activeRanges.some(([s, e]) => lineNum >= s && lineNum <= e);
        if (isActive && !firstActiveLineElId) firstActiveLineElId = `code-line-${lineNum}`;
        const mappedNode = getNodeForLine(state.activeFile, lineNum);
        const nodeColor = NODES[mappedNode] ? NODES[mappedNode].accent : '#38bdf8';

        html += `
          <div id="code-line-${lineNum}"
               class="code-line ${isActive ? 'active-line' : ''}"
               style="--active-accent: ${accent}; border-left-color: ${isActive ? accent : 'transparent'};"
               data-line="${lineNum}"
               data-node="${mappedNode}"
               title="点击查看对应流程节点：${NODES[mappedNode].title}">
            <span class="line-num">${lineNum}</span>
            <span class="line-code">${highlightPythonLine(raw)}</span>
          </div>
        `;
      });

      container.innerHTML = html;

      // Update file tab styles
      document.getElementById('tab-agent').className = state.activeFile === 'agent'
        ? 'file-tab flex items-center gap-1.5 px-2.5 py-1 text-xs font-semibold rounded-md bg-sky-500/20 text-sky-300 border border-sky-500/35'
        : 'file-tab flex items-center gap-1.5 px-2.5 py-1 text-xs font-medium rounded-md text-slate-400 hover:text-slate-200 border border-transparent';
      document.getElementById('tab-tools').className = state.activeFile === 'tools'
        ? 'file-tab flex items-center gap-1.5 px-2.5 py-1 text-xs font-semibold rounded-md bg-amber-500/20 text-amber-300 border border-amber-500/35'
        : 'file-tab flex items-center gap-1.5 px-2.5 py-1 text-xs font-medium rounded-md text-slate-400 hover:text-slate-200 border border-transparent';

      // Update active line range footer
      const rangeText = activeRanges.length
        ? `${fileObj.name} · 第 ${activeRanges.map(([s, e]) => s === e ? `${s}` : `${s}-${e}`).join(', ')} 行`
        : `${fileObj.name} · 点击任意行高亮`;
      document.getElementById('active-line-range').textContent = rangeText;

      if (scrollToActive && firstActiveLineElId) {
        const el = document.getElementById(firstActiveLineElId);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    function renderDiagram() {

      svg.querySelectorAll('.flow-node').forEach(g => {

        if (activeId) {
          if (nid === activeId) {
            g.classList.add('active-node');
          } else {
            g.classList.add('dimmed');
          }
        }
      });

      // Edges
      svg.querySelectorAll('.flow-edge').forEach(path => {
        const eid = path.getAttribute('id');
        path.classList.remove('active-edge');
        if (activeId && activeEdges.includes(eid)) {
          path.classList.add('active-edge');
          path.setAttribute('stroke', activeNode.accent);
          path.setAttribute('stroke-width', '2.6');
          path.setAttribute('marker-end', 'url(#arrow-sky)');
          path.style.opacity = '1';

          path.setAttribute('stroke', '#475569');

          path.style.opacity = activeId ? '0.28' : '0.85';

      const badge = document.getElementById('diagram-active-badge');

        badge.textContent = `当前聚焦：${activeNode.title}`;

      const snapshots = {

        append_user: SCENARIOS.normal.steps[3].messages,

        execute_tool: SCENARIOS.normal.steps[6].messages,
        concrete_tools: SCENARIOS.normal.steps[6].messages,
        final_answer: SCENARIOS.normal.steps[8].messages,
        max_steps: SCENARIOS.normal.steps[7].messages

      return snapshots[state.activeNodeId] || SCENARIOS.normal.steps[2].messages;

    function renderStepBar() {
      const steps = SCENARIOS[state.scenarioKey].steps;
      const summaryEl = document.getElementById('step-summary');
      if (summaryEl) {
        if (state.simMode) {
          summaryEl.textContent = steps[state.simStepIndex].label;

          summaryEl.textContent = activeNode ? activeNode.title : '';
        }
      }
      document.getElementById('btn-prev').disabled = state.simMode && state.simStepIndex === 0;
      document.getElementById('btn-next').disabled = state.simMode && state.simStepIndex === steps.length - 1;

      const labelPlay = document.getElementById('label-play');
      labelPlay.textContent = state.playTimer ? '暂停' : (state.simMode ? '继续' : '演示');
    }

    function renderAll(scrollCode = false) {
      renderCodePanel(scrollCode);
      renderDiagram();
      renderInspector();
      renderStepBar();
    }

    // =========================================================================
    // 7. INTERACTION HANDLERS
    // =========================================================================
    function stopAutoPlay() {
      if (state.playTimer) {
        clearInterval(state.playTimer);
        state.playTimer = null;
      }
    }

    function selectNode(nodeId, preferredFile = null, scrollCode = true) {
      stopAutoPlay();
      state.simMode = false;
      state.activeNodeId = nodeId;
      if (preferredFile) {
        state.activeFile = preferredFile;
      } else if (nodeId && NODES[nodeId]) {
        const node = NODES[nodeId];
        // Switch file only if current file has no lines for this node
        const curHas = (node.codeRanges[state.activeFile] || []).length > 0;
        if (!curHas) state.activeFile = node.primaryFile;
      }
      renderAll(scrollCode);
      const inspScroll = document.getElementById('inspector-scroll-area');
      if (inspScroll) inspScroll.scrollTop = 0;
    }

    function goToSimStep(index) {
      const steps = SCENARIOS[state.scenarioKey].steps;
      const clamped = Math.max(0, Math.min(steps.length - 1, index));
      state.simMode = true;
      state.simStepIndex = clamped;
      const step = steps[clamped];
      state.activeNodeId = step.nodeId;
      state.activeFile = step.file;
      renderAll(true);
    }

    function togglePlay() {
      if (state.playTimer) {
        stopAutoPlay();
        renderStepBar();
        return;
      }
      const steps = SCENARIOS[state.scenarioKey].steps;
      if (!state.simMode || state.simStepIndex >= steps.length - 1) {
        goToSimStep(0);
      }
      state.playTimer = setInterval(() => {
        const total = SCENARIOS[state.scenarioKey].steps.length;
        if (state.simStepIndex < total - 1) {
          goToSimStep(state.simStepIndex + 1);
        } else {
          stopAutoPlay();
          renderStepBar();
        }
      }, 2800);
      renderStepBar();
    }

    // Bind DOM Events
    document.getElementById('tab-agent').addEventListener('click', () => {
      state.activeFile = 'agent';
      renderCodePanel(false);
    });
    document.getElementById('tab-tools').addEventListener('click', () => {
      state.activeFile = 'tools';
      renderCodePanel(false);
    });

    // Delegate click on code lines
    document.getElementById('code-lines-container').addEventListener('click', (e) => {
      const lineEl = e.target.closest('.code-line');
      if (!lineEl) return;
      const nodeId = lineEl.getAttribute('data-node');
      selectNode(nodeId, state.activeFile, false);
    });



    // Click on SVG diagram nodes
    document.getElementById('agent-flow-svg').addEventListener('click', (e) => {
      const nodeG = e.target.closest('.flow-node');
      if (!nodeG) return;
      const nodeId = nodeG.getAttribute('data-node');
      selectNode(nodeId, NODES[nodeId].primaryFile, true);
    });

    // Show all / clear focus
    document.getElementById('btn-show-all').addEventListener('click', () => {
      stopAutoPlay();
      state.simMode = false;
      state.activeNodeId = null;
      renderAll(false);
    });

    // Inspector tabs
    ['explain', 'messages', 'registry'].forEach(tab => {
      document.getElementById(`insp-tab-${tab}`).addEventListener('click', () => {
        state.activeInspTab = tab;
        if (state.diagramExpanded) {
          state.diagramExpanded = false;
          const rp = document.querySelector('.right-pane');
          const lbl = document.getElementById('label-expand-diagram');
          if (rp) rp.classList.remove('diagram-expanded');
          if (lbl) lbl.textContent = '收起解析';
        }
        renderInspector();
      });
    });

    // Delegate cross-file jump buttons inside inspector
    document.getElementById('panel-explain').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-jump-file]');
      if (!btn) return;
      selectNode(btn.getAttribute('data-jump-node'), btn.getAttribute('data-jump-file'), true);
    });

    // Delegate tool cards click in registry tab
    document.getElementById('panel-registry').addEventListener('click', (e) => {
      const card = e.target.closest('[data-tool-card]');
      if (!card) return;
      selectNode('concrete_tools', 'tools', true);
    });

    // Simulation controls
    document.getElementById('btn-play').addEventListener('click', togglePlay);
    document.getElementById('btn-prev').addEventListener('click', () => {
      stopAutoPlay();
      if (!state.simMode) goToSimStep(0);
      else goToSimStep(state.simStepIndex - 1);
    });
    document.getElementById('btn-next').addEventListener('click', () => {
      stopAutoPlay();
      if (!state.simMode) goToSimStep(0);
      else goToSimStep(state.simStepIndex + 1);
    });
    document.getElementById('btn-reset').addEventListener('click', () => {
      stopAutoPlay();
      state.simMode = false;
      state.simStepIndex = 0;
      state.activeFile = 'agent';
      state.activeNodeId = 'llm_call';
      renderAll(true);
    });

    // Scenario switcher
    function setScenario(key) {
      stopAutoPlay();
      state.scenarioKey = key;
      document.getElementById('btn-scenario-normal').className = key === 'normal'
        ? 'px-2 py-0.5 rounded font-medium bg-sky-500/20 text-sky-300'
        : 'px-2 py-0.5 rounded font-medium text-slate-400 hover:text-slate-200';
      document.getElementById('btn-scenario-error').className = key === 'error'
        ? 'px-2 py-0.5 rounded font-medium bg-amber-500/20 text-amber-300'
        : 'px-2 py-0.5 rounded font-medium text-slate-400 hover:text-slate-200';
      goToSimStep(0);
    }
    document.getElementById('btn-scenario-normal').addEventListener('click', () => setScenario('normal'));
    document.getElementById('btn-scenario-error').addEventListener('click', () => setScenario('error'));



    // Keyboard navigation (Left/Right arrows in sim mode)
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === 'ArrowRight') {
        stopAutoPlay();
        goToSimStep(state.simMode ? state.simStepIndex + 1 : 0);
      } else if (e.key === 'ArrowLeft' && state.simMode) {
        stopAutoPlay();
        goToSimStep(state.simStepIndex - 1);
      }
    });

    // Diagram Zoom & Expand Controls
    function applyDiagramZoom() {
      const svg = document.getElementById('agent-flow-svg');
      const label = document.getElementById('zoom-label');
      if (!svg || !label) return;
      label.textContent = state.diagramZoom + '%';
      if (state.diagramZoom === 100) {
        svg.style.width = '100%';
        svg.style.height = '100%';
      } else {
        svg.style.width = state.diagramZoom + '%';
        svg.style.height = state.diagramZoom + '%';
      }
    }
    document.getElementById('btn-zoom-in').addEventListener('click', () => {
      state.diagramZoom = Math.min(200, state.diagramZoom + 20);
      applyDiagramZoom();
    });
    document.getElementById('btn-zoom-out').addEventListener('click', () => {
      state.diagramZoom = Math.max(80, state.diagramZoom - 20);
      applyDiagramZoom();
    });
    document.getElementById('btn-expand-diagram').addEventListener('click', () => {
      state.diagramExpanded = !state.diagramExpanded;
      const rp = document.querySelector('.right-pane');
      const lbl = document.getElementById('label-expand-diagram');
      if (rp) rp.classList.toggle('diagram-expanded', state.diagramExpanded);
      if (lbl) lbl.textContent = state.diagramExpanded ? '展开解析' : '收起解析';
    });

    // Initial render
    renderAll(true);
    lucide.createIcons();
  </script>
</body>
</html>
